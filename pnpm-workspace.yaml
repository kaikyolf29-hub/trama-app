packages:
  - apps/*
  - packages/*
  - tooling

# Versões compartilhadas por vários pacotes. No package.json use "catalog:".
catalog:
  '@types/node': ^24.19.4
  eslint: ^10.15.0
  stylelint: ^18.1.0
  typescript: ~6.0.3
  typescript-eslint: ^8.74.0
  vitest: ^5.1.2
  zod: ^4.6.7

# O que as dependências podem fazer. O pnpm 12 recusa instalar enquanto houver pedido sem
# decisão (`pnpm approve` para decidir).
# - build: scripts de instalação. O esbuild (do tsx) e o workerd (do wrangler) não precisam
#   dos seus: o binário já vem no pacote da plataforma. O onnxruntime-node e o protobufjs
#   (do Transformers.js) também ficam sem: o site só usa a versão de navegador do runtime. O
#   protobufjs também vem com o @google/genai, e o script dele só confere a versão do Node.
# - skills: instruções para agentes de IA vindas de fora do repositório. Negadas: as regras
#   dos agentes estão no AGENTS.md.
permissions:
  '@tanstack/react-router':
    skills: false
  esbuild:
    build: false
  onnxruntime-node:
    build: false
  protobufjs:
    build: false
  workerd:
    build: false
