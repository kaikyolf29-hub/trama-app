packages:
  - apps/*
  - packages/*
  - tooling

# Scripts de instalação de dependências: o pnpm 12 recusa os que não estão listados aqui.
# O esbuild (do tsx) não precisa do seu: o binário já vem no pacote da plataforma.
allowBuilds:
  esbuild: false

# Versões compartilhadas por vários pacotes. No package.json use "catalog:".
catalog:
  '@types/node': ^24.19.4
  eslint: ^10.15.0
  stylelint: ^18.1.0
  typescript: ~6.0.3
  typescript-eslint: ^8.74.0
  vitest: ^5.1.2
  zod: ^4.6.7
